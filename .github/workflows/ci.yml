name: CI
on:
  - push
  - pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        node_version:
          - '22'
          - '24'
          - '26'
    name: Node ${{ matrix.node_version }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint:ci
      - name: Run typecheck
        run: npm run ts:check
      - name: Run test coverage
        run: npm run test:coverage

  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies and native Git hooks
        shell: bash
        env:
          CI: 'false'
        run: npm run setup
      - name: Verify commit-message hook
        shell: bash
        run: |
          printf 'chore: verify Windows setup\n' > .git/setup-test-message
          git hook run commit-msg -- .git/setup-test-message
      - name: Validate Windows development commands
        run: npm run validate

  benchmarks:
    runs-on: ubuntu-latest
    env:
      THRESHOLD: 50000
    steps:
      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk
      - name: Verify wrk installation
        run: |
          if ! command -v wrk &> /dev/null; then
            echo "Error: wrk installation failed"
            exit 1
          fi
          echo "wrk installed successfully: $(wrk --version 2>&1 | head -1)"
      # First checkout master and run benchmarks
      - name: Checkout master branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock=true
          fi
      - name: Run benchmarks
        run: npm run --silent benchmark > bench-result.txt || echo "0" > bench-result.txt
      # Store output of bench-result.txt to workflow output
      - name: Store benchmark result
        id: main_benchmark
        run: |
          result=$(xargs < bench-result.txt)
          [[ "$result" =~ ^[0-9]+([.][0-9]+)?$ ]] || exit 1
          echo "result=$result" >> "$GITHUB_OUTPUT"

      # Now checkout the PR branch and run benchmarks
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node for PR branch
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run benchmarks
        run: npm run --silent benchmark > bench-result.txt
      # Store output of bench-result.txt to workflow output
      - name: Store benchmark result
        id: branch_benchmark
        run: |
          result=$(xargs < bench-result.txt)
          [[ "$result" =~ ^[0-9]+([.][0-9]+)?$ ]] || exit 1
          echo "result=$result" >> "$GITHUB_OUTPUT"

      # Verify difference between main and branch benchmark outputs aren't greater than THRESHOLD env var
      - name: Verify benchmark results
        run: |
          main_result=${{ steps.main_benchmark.outputs.result }}
          branch_result=${{ steps.branch_benchmark.outputs.result }}
          difference=$(echo "$main_result - $branch_result" | bc)
          echo "Main benchmark result: $main_result"
          echo "Branch benchmark result: $branch_result"
          echo "Difference: $difference"
          if (( $(echo "$difference > $THRESHOLD" | bc -l) )); then
            echo "Benchmark difference exceeds threshold of $THRESHOLD"
            exit 1
          else
            echo "Benchmark difference is within acceptable limit (< $THRESHOLD)."
          fi
