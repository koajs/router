name: CI
on:
  - push
  - pull_request
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        node_version:
          - '22'
          - '24'
          - '26'
    name: Node ${{ matrix.node_version }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false
      - name: Setup npm
        run: npm install --global npm@12.2.2
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node_version }}-npm-12-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run typecheck
        run: npm run ts:check
      - name: Run test coverage
        run: npm run test:coverage

  benchmarks:
    runs-on: ubuntu-latest
    env:
      THRESHOLD: 50000
    steps:
      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk
      - name: Verify wrk installation
        run: |
          if ! command -v wrk &> /dev/null; then
            echo "Error: wrk installation failed"
            exit 1
          fi
          echo "wrk installed successfully: $(wrk --version 2>&1 | head -1)"
      # First checkout master and run benchmarks
      - name: Checkout master branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Setup npm
        run: npm install --global npm@12.2.2
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-26-npm-12-${{ hashFiles('package-lock.json') || hashFiles('package.json') }}
      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --package-lock=true
          fi
          npm ci --package-lock=true
      - name: Run benchmarks
        run: npm run benchmark || echo "0" > bench-result.txt
      # Store output of bench-result.txt to workflow output
      - name: Store benchmark result
        id: main_benchmark
        run: |
          echo "result=$(cat bench-result.txt)" >> "$GITHUB_OUTPUT"

      # Now checkout the PR branch and run benchmarks
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node for PR branch
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Setup npm
        run: npm install --global npm@12.2.2
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-26-npm-12-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run benchmarks
        run: npm run benchmark
      # Store output of bench-result.txt to workflow output
      - name: Store benchmark result
        id: branch_benchmark
        run: |
          echo "result=$(cat bench-result.txt)" >> "$GITHUB_OUTPUT"

      # Verify difference between main and branch benchmark outputs aren't greater than THRESHOLD env var
      - name: Verify benchmark results
        run: |
          main_result=${{ steps.main_benchmark.outputs.result }}
          branch_result=${{ steps.branch_benchmark.outputs.result }}
          difference=$(echo "$main_result - $branch_result" | bc)
          echo "Main benchmark result: $main_result"
          echo "Branch benchmark result: $branch_result"
          echo "Difference: $difference"
          if (( $(echo "$difference > $THRESHOLD" | bc -l) )); then
            echo "Benchmark difference exceeds threshold of $THRESHOLD"
            exit 1
          else
            echo "Benchmark difference is within acceptable limit (< $THRESHOLD)."
          fi
