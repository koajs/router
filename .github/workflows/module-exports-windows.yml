name: Windows module exports

on:
  pull_request:
    paths:
      - '.github/workflows/module-exports-windows.yml'
      - 'package*.json'
      - 'src/**'
      - 'test/index.test.ts'
      - 'tsconfig*.json'
      - 'tsup.config.ts'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/module-exports-windows.yml'
      - 'package*.json'
      - 'src/**'
      - 'test/index.test.ts'
      - 'tsconfig*.json'
      - 'tsup.config.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exports:
    name: Module exports on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Set up npm
        run: npm install --global npm@12.2.2
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check CommonJS and ESM exports
        env:
          TS_NODE_PROJECT: tsconfig.ts-node.json
        run: node --require ts-node/register/transpile-only --test test/index.test.ts
